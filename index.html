<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Mau-Mau Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Spieler, Punktestände und Ranking für eure Mau-Mau-Runden – inklusive individuellem Regelwerk." />
<style>
  :root{
    color-scheme: light;
    --bg:#F2F2F7;
    --bg-elev:#FAFAFC;
    --card:#FFFFFF;
    --card-2:#F7F7F9;
    --label:#1C1C1E;
    --label-2:rgba(60,60,67,.62);
    --label-3:rgba(60,60,67,.4);
    --sep:rgba(60,60,67,.16);
    --sep-strong:rgba(60,60,67,.29);
    --blue:#007AFF;
    --blue-ink:#FFFFFF;
    --green:#34C759;
    --red:#FF3B30;
    --orange:#FF9500;
    --yellow:#FFCC00;
    --purple:#AF52DE;
    --gold:#C99A2E;
    --silver:#9AA0A6;
    --bronze:#B4763B;
    --shadow-1:0 1px 2px rgba(28,28,30,.06), 0 1px 1px rgba(28,28,30,.04);
    --shadow-2:0 12px 28px rgba(28,28,30,.14), 0 2px 8px rgba(28,28,30,.08);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --nav-blur: saturate(180%) blur(20px);
    --nav-bg: rgba(242,242,247,.78);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#000000;
      --bg-elev:#0B0B0D;
      --card:#1C1C1E;
      --card-2:#242426;
      --label:#F5F5F7;
      --label-2:rgba(235,235,245,.6);
      --label-3:rgba(235,235,245,.38);
      --sep:rgba(84,84,88,.5);
      --sep-strong:rgba(84,84,88,.65);
      --blue:#0A84FF;
      --blue-ink:#FFFFFF;
      --green:#30D158;
      --red:#FF453A;
      --orange:#FF9F0A;
      --yellow:#FFD60A;
      --purple:#BF5AF2;
      --gold:#E0B84A;
      --silver:#B7BCC2;
      --bronze:#C98A55;
      --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.3);
      --shadow-2:0 16px 36px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
      --nav-bg: rgba(0,0,0,.66);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#000000;
    --bg-elev:#0B0B0D;
    --card:#1C1C1E;
    --card-2:#242426;
    --label:#F5F5F7;
    --label-2:rgba(235,235,245,.6);
    --label-3:rgba(235,235,245,.38);
    --sep:rgba(84,84,88,.5);
    --sep-strong:rgba(84,84,88,.65);
    --blue:#0A84FF;
    --blue-ink:#FFFFFF;
    --green:#30D158;
    --red:#FF453A;
    --orange:#FF9F0A;
    --yellow:#FFD60A;
    --purple:#BF5AF2;
    --gold:#E0B84A;
    --silver:#B7BCC2;
    --bronze:#C98A55;
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.3);
    --shadow-2:0 16px 36px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
    --nav-bg: rgba(0,0,0,.66);
  }

  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--label); overflow-x:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:15.5px; line-height:1.45; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.01em; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; color:inherit; }
  a{ color:var(--blue); }
  ::selection{ background:rgba(0,122,255,.25); }

  /* ---------- layout shell ---------- */
  .app{ min-height:100vh; display:flex; flex-direction:column; }

  .navbar{
    position:sticky; top:0; z-index:30;
    background:var(--nav-bg); -webkit-backdrop-filter:var(--nav-blur); backdrop-filter:var(--nav-blur);
    border-bottom:1px solid var(--sep);
  }
  .navbar-inner{
    max-width:860px; margin:0 auto; padding:14px 20px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; flex:none;
    background:linear-gradient(150deg, var(--blue), var(--purple));
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:var(--shadow-1);
  }
  .brand-mark svg{ width:20px; height:20px; }
  .brand-text{ min-width:0; }
  .brand h1{ font-size:1.18rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand .tag{ color:var(--label-2); font-size:.8rem; margin-top:1px; }
  .navbar-right{ display:flex; align-items:center; gap:8px; flex:none; }

  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
    background:var(--card-2); color:var(--label); display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:active{ transform:scale(.9); }
  .icon-btn svg{ width:18px; height:18px; }

  .sync-dot{ width:8px; height:8px; border-radius:50%; background:var(--label-3); flex:none; transition:background .3s ease; }
  .sync-dot.sync-syncing{ background:var(--blue); animation:sync-pulse 1s ease-in-out infinite; }
  .sync-dot.sync-ok{ background:var(--green); }
  .sync-dot.sync-error{ background:var(--red); }
  .sync-dot.sync-offline{ background:var(--orange); }
  .sync-dot.sync-readonly{ background:var(--purple); }
  @keyframes sync-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .tabbar{
    max-width:860px; margin:0 auto; padding:2px 20px 12px;
    display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{ display:none; }
  .tabbar-track{
    display:flex; gap:2px; background:var(--card-2); padding:3px; border-radius:12px; width:100%;
  }
  .tab{
    flex:1 1 0; white-space:nowrap; padding:8px 10px; border:none; background:transparent; border-radius:9px;
    color:var(--label-2); font-size:.86rem; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .tab svg{ width:15px; height:15px; flex:none; }
  .tab.active{ background:var(--card); color:var(--label); box-shadow:var(--shadow-1); }
  .tab:not(.active):hover{ color:var(--label); }

  .container{ flex:1; max-width:860px; margin:0 auto; padding:18px 20px 64px; width:100%; }
  .view{ animation:fadein .22s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 0 10px; }
  .section-head:first-child{ margin-top:2px; }
  .section-head h2{ font-size:1.28rem; }
  .section-sub{ color:var(--label-2); font-size:.88rem; margin-top:2px; }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:980px; padding:9px 16px;
    font-size:.88rem; font-weight:600; display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s ease, opacity .15s ease, background .15s ease;
  }
  .btn svg{ width:15px; height:15px; }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:hover{ opacity:.92; }
  .btn-secondary{ background:var(--card-2); color:var(--label); }
  .btn-secondary:hover{ background:var(--sep); }
  .btn-destructive{ background:transparent; color:var(--red); }
  .btn-destructive:hover{ background:rgba(255,59,48,.1); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:6px 12px; font-size:.8rem; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- cards / lists ---------- */
  .card{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-1);
    border:1px solid var(--sep); overflow:hidden;
  }
  .card + .card{ margin-top:12px; }
  .pad{ padding:16px; }

  .list{ display:flex; flex-direction:column; }
  .list-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px;
    border-bottom:1px solid var(--sep);
  }
  .list-row:last-child{ border-bottom:none; }

  .empty{
    text-align:center; padding:44px 20px; color:var(--label-2);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .empty .empty-icon{
    width:56px; height:56px; border-radius:50%; background:var(--card-2);
    display:flex; align-items:center; justify-content:center; color:var(--label-3);
  }
  .empty .empty-icon svg{ width:26px; height:26px; }
  .empty strong{ color:var(--label); font-size:1rem; }

  /* ---------- avatars ---------- */
  .avatar{
    width:42px; height:42px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:.86rem; letter-spacing:.02em; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  .avatar.sm{ width:32px; height:32px; font-size:.72rem; }
  .avatar.lg{ width:64px; height:64px; font-size:1.15rem; }

  .photo-picker{ display:flex; align-items:center; gap:14px; }
  .photo-picker .avatar{ width:64px; height:64px; font-size:1.15rem; }
  .photo-picker-actions{ display:flex; flex-direction:column; gap:8px; }
  .photo-picker input[type=file]{ display:none; }

  /* ---------- podium / ranking ---------- */
  .podium{ display:flex; align-items:flex-end; gap:10px; margin-bottom:16px; }
  .podium-slot{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .podium-slot .crown{ color:var(--gold); width:22px; height:22px; }
  .podium-name{ font-weight:700; font-size:.86rem; text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .podium-score{ font-size:.78rem; color:var(--label-2); }
  .podium-bar{
    width:100%; border-radius:14px 14px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px;
    box-shadow:var(--shadow-1);
  }
  .podium-rank{ font-weight:800; font-size:1.1rem; color:#fff; }
  .podium-slot.rank-1 .podium-bar{ height:104px; background:linear-gradient(160deg, var(--gold), #a97f1d); }
  .podium-slot.rank-2 .podium-bar{ height:78px; background:linear-gradient(160deg, var(--silver), #767b81); }
  .podium-slot.rank-3 .podium-bar{ height:60px; background:linear-gradient(160deg, var(--bronze), #8a5527); }

  .rank-row{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--sep); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-num{ width:22px; text-align:center; font-weight:700; color:var(--label-3); font-size:.86rem; flex:none; }
  .rank-info{ flex:1; min-width:0; }
  .rank-info .name{ font-weight:600; font-size:.94rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-info .meta{ font-size:.78rem; color:var(--label-2); margin-top:1px; }
  .rank-score{ text-align:right; flex:none; }
  .rank-score .val{ font-weight:800; font-size:1.02rem; }
  .rank-score .lbl{ font-size:.72rem; color:var(--label-2); }

  /* ---------- chips / badges ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:980px;
    font-size:.72rem; font-weight:700; background:var(--card-2); color:var(--label-2);
  }
  .chip.win{ background:rgba(52,199,89,.15); color:var(--green); }
  .chip.mau{ background:rgba(255,149,0,.15); color:var(--orange); }
  .chip svg{ width:11px; height:11px; }

  /* ---------- players grid ---------- */
  .players-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .player-card{
    background:var(--card); border-radius:var(--radius-md); border:1px solid var(--sep); box-shadow:var(--shadow-1);
    padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .player-card-top{ display:flex; align-items:center; gap:12px; }
  .player-card .name{ font-weight:700; font-size:.98rem; }
  .player-card .sub{ font-size:.78rem; color:var(--label-2); }
  .player-stats{ display:flex; gap:14px; }
  .player-stats div{ font-size:.78rem; color:var(--label-2); }
  .player-stats strong{ display:block; color:var(--label); font-size:.98rem; font-weight:700; }
  .player-card-actions{ display:flex; gap:8px; margin-top:2px; }

  /* ---------- matchdays ---------- */
  .md-card{ background:var(--card); border-radius:var(--radius-md); border:1px solid var(--sep); box-shadow:var(--shadow-1); }
  .md-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
  .md-date{ flex:1; min-width:0; }
  .md-date .d{ font-weight:700; font-size:.94rem; }
  .md-date .t{ font-size:.78rem; color:var(--label-2); margin-top:1px; }
  .md-head .chev{ width:16px; height:16px; color:var(--label-3); transition:transform .2s ease; flex:none; }
  .md-head .chev.open{ transform:rotate(180deg); }
  .md-actions{ display:flex; gap:6px; flex:none; }
  .md-body{ border-top:1px solid var(--sep); padding:6px 16px 14px; }
  .md-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .md-table{ width:100%; min-width:340px; border-collapse:collapse; font-size:.86rem; }
  .md-table th{ text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--label-3); font-weight:700; padding:10px 8px 6px; }
  .md-table td{ padding:8px; border-top:1px solid var(--sep); }
  .md-table tr td:first-child, .md-table th:first-child{ padding-left:2px; }
  .md-player{ display:flex; align-items:center; gap:8px; }
  .md-note{ padding:10px 2px 2px; color:var(--label-2); font-size:.82rem; font-style:italic; }

  /* ---------- forms ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.78rem; font-weight:700; color:var(--label-2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.02em; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--sep-strong); background:var(--bg-elev);
    color:var(--label); font-size:.92rem; outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(10,132,255,.18); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:.76rem; color:var(--label-3); margin-top:6px; }

  .swatches{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{
    width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; position:relative;
  }
  .swatch.selected{ border-color:var(--label); box-shadow:0 0 0 2px var(--card); }
  .swatch.selected::after{
    content:""; position:absolute; inset:0; border-radius:50%; box-shadow:inset 0 0 0 2px #fff;
  }

  .seg{ display:flex; background:var(--card-2); border-radius:10px; padding:3px; gap:2px; }
  .seg button{
    flex:1; border:none; background:transparent; padding:8px 10px; border-radius:7px; cursor:pointer;
    font-size:.82rem; font-weight:600; color:var(--label-2); transition:background .15s ease, color .15s ease;
  }
  .seg button.active{ background:var(--card); color:var(--label); box-shadow:var(--shadow-1); }

  .stepper{ display:flex; align-items:center; gap:0; background:var(--bg-elev); border:1px solid var(--sep-strong); border-radius:var(--radius-sm); overflow:hidden; width:fit-content; }
  .stepper button{ width:32px; height:32px; border:none; background:transparent; cursor:pointer; color:var(--blue); font-size:1.05rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .stepper button:active{ background:var(--sep); }
  .stepper .val{ min-width:26px; text-align:center; font-weight:700; font-size:.86rem; }

  .participant-row{
    display:flex; flex-direction:column; gap:10px; padding:12px; margin-bottom:8px;
    border-radius:var(--radius-sm); background:var(--card-2); border:1px solid transparent;
    border-left:3px solid var(--row-color, var(--sep-strong)); transition:opacity .15s ease;
  }
  .participant-row:last-child{ margin-bottom:0; }
  .participant-row.off{ opacity:.5; }
  .participant-row .who{ display:flex; align-items:center; gap:10px; min-width:0; }
  .participant-row .who .name{ flex:1; min-width:0; font-weight:600; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toggle-in{ width:24px; height:24px; border-radius:7px; border:1.5px solid var(--sep-strong); flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--bg-elev); }
  .toggle-in.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .toggle-in svg{ width:14px; height:14px; }
  .not-in-badge{ font-size:.72rem; font-weight:700; color:var(--label-3); flex:none; }
  .participant-controls{ display:flex; gap:10px; padding-left:34px; }
  .mini-field{ display:flex; flex-direction:column; gap:5px; }
  .mini-field.grow{ flex:1; }
  .mini-field .mini-label{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--label-3); }
  .pts-input{ width:100%; padding:7px 6px; text-align:center; border-radius:8px; border:1px solid var(--sep-strong); background:var(--bg-elev); color:var(--label); font-weight:700; font-size:.86rem; }
  .participant-row.off .pts-input, .participant-row.off .stepper{ pointer-events:none; }

  /* ---------- rules ---------- */
  .rule-row{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--sep); }
  .rule-row:last-child{ border-bottom:none; }
  .rule-num{ width:22px; height:22px; border-radius:50%; background:var(--card-2); color:var(--label-2); font-size:.72rem; font-weight:800; flex:none; display:flex; align-items:center; justify-content:center; margin-top:4px; }
  .rule-row textarea{ flex:1; resize:vertical; min-height:44px; }

  /* ---------- stats bars ---------- */
  .bar-row{ display:flex; align-items:center; gap:10px; padding:8px 0; }
  .bar-row .who{ width:108px; flex:none; font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:10px; border-radius:6px; background:var(--card-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; transition:width .4s ease; }
  .bar-val{ width:44px; flex:none; text-align:right; font-size:.8rem; font-weight:700; color:var(--label-2); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:6px; }
  .stat-tile{ background:var(--card-2); border-radius:var(--radius-sm); padding:12px; }
  .stat-tile .n{ font-size:1.3rem; font-weight:800; }
  .stat-tile .l{ font-size:.72rem; color:var(--label-2); font-weight:600; margin-top:2px; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;
    animation:overlayin .18s ease;
  }
  @keyframes overlayin{ from{ opacity:0; } to{ opacity:1; } }
  .modal{
    background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; box-shadow:var(--shadow-2); animation:modalup .22s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width:640px){
    .overlay{ align-items:center; padding:20px; }
    .modal{ border-radius:20px; max-height:min(88vh,720px); }
    @keyframes modalup{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
  }
  @media (max-width:639px){
    @keyframes modalup{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px;
    border-bottom:1px solid var(--sep); position:sticky; top:0; background:var(--bg); z-index:2;
  }
  .modal-head h3{ font-size:1.05rem; }
  .modal-body{ padding:18px; }
  .modal-foot{ padding:14px 18px 18px; display:flex; gap:10px; border-top:1px solid var(--sep); }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px); z-index:200;
    background:var(--label); color:var(--bg); padding:10px 18px; border-radius:980px; font-size:.84rem; font-weight:600;

<!-- Firebase-Anbindung (ES-Modul, getrennt vom Haupt-Script). Stellt window.FB
     bereit: {available, ready, onPlayers, onMatchdays, onRules, addPlayer,
     updatePlayer, deletePlayer, addMatchday, updateMatchday, deleteMatchday,
     setRules, claimSeed}. Ohne gültige Konfiguration bleibt window.FB.available
     false und die App läuft rein lokal weiter (siehe startFirebase() unten). -->
<script type="module">
(function(){
  "use strict";
  // TODO: Werte aus der Firebase-Konsole eintragen (Projekteinstellungen →
  // "Meine Apps" → Web-App → SDK-Konfiguration). Cloud Firestore muss im
  // Projekt aktiviert sein (Build → Firestore Database).
  var firebaseConfig = {
    apiKey: "REPLACE_ME",
    authDomain: "REPLACE_ME.firebaseapp.com",
    projectId: "REPLACE_ME",
    storageBucket: "REPLACE_ME.appspot.com",
    messagingSenderId: "REPLACE_ME",
    appId: "REPLACE_ME"
  };
  var configured = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("REPLACE_ME") === -1;

  window.FB = { ready: false, available: false };

  function finish(){
    window.FB.ready = true;
    document.dispatchEvent(new CustomEvent("fb-ready"));
  }

  if(!configured){
    finish();
    return;
  }

  Promise.all([
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
  ]).then(function(mods){
    var appMod = mods[0], fs = mods[1];
    try{
      var app = appMod.initializeApp(firebaseConfig);
      var db = fs.getFirestore(app);

      function listCollection(name, cb){
        return fs.onSnapshot(fs.collection(db, name), function(snap){
          cb(snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); }));
        }, function(err){ cb(null, err); });
      }

      window.FB.onPlayers = function(cb){ return listCollection("players", cb); };
      window.FB.onMatchdays = function(cb){ return listCollection("matchdays", cb); };
      window.FB.onRules = function(cb){
        return fs.onSnapshot(fs.doc(db, "settings", "rules"), function(snap){
          cb(snap.exists() ? snap.data() : null);
        }, function(err){ cb(null, err); });
      };

      window.FB.addPlayer = function(data){ return fs.addDoc(fs.collection(db, "players"), data); };
      window.FB.updatePlayer = function(id, data){ return fs.updateDoc(fs.doc(db, "players", id), data); };
      window.FB.deletePlayer = function(id){ return fs.deleteDoc(fs.doc(db, "players", id)); };

      window.FB.addMatchday = function(data){ return fs.addDoc(fs.collection(db, "matchdays"), data); };
      window.FB.updateMatchday = function(id, data){ return fs.updateDoc(fs.doc(db, "matchdays", id), data); };
      window.FB.deleteMatchday = function(id){ return fs.deleteDoc(fs.doc(db, "matchdays", id)); };

      window.FB.setRules = function(data){ return fs.setDoc(fs.doc(db, "settings", "rules"), data, { merge: true }); };

      // Verhindert doppeltes Importieren der Startdaten, falls mehrere
      // Geräte gleichzeitig zum ersten Mal laden.
      window.FB.claimSeed = function(){
        var ref = fs.doc(db, "settings", "seeded");
        return fs.getDoc(ref).then(function(snap){
          if(snap.exists()) return false;
          return fs.setDoc(ref, { at: new Date().toISOString() }).then(function(){ return true; });
        });
      };

      window.FB.available = true;
    }catch(e){
      window.FB.available = false;
    }
    finish();
  }).catch(function(){
    window.FB.available = false;
    finish();
  });
})();
</script>

  /* ============================ REMOTE SYNC (Firebase) ============================

     settings/rules) halten den lokalen `state` in Echtzeit synchron zu allen

  var syncStatusTimer = null;
  function setSyncStatus(s){
    var el = document.getElementById("syncStatus");
    if(!el) return;
    clearTimeout(syncStatusTimer);
    el.className = "sync-dot sync-" + s;
    el.title = {
      idle: "Geteilte Daten – synchronisiert", syncing: "Synchronisiere…", ok: "Synchronisiert",
      error: "Fehler bei den geteilten Daten", offline: "Nur lokal in diesem Browser gespeichert (keine geteilten Daten verfügbar)"
    }[s] || "Geteilte Daten";
    if(s === "ok") syncStatusTimer = setTimeout(function(){ setSyncStatus("idle"); }, 2500);
  }

  function cacheLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ players: state.players, matchdays: state.matchdays, rules: state.rules })); }catch(e){}
  }
  function loadLocalFallback(){
    var d = defaultState();
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var p = JSON.parse(raw);
        state.players = Array.isArray(p.players) ? p.players : [];
        state.matchdays = Array.isArray(p.matchdays) ? p.matchdays : [];
        state.rules = Object.assign({}, d.rules, p.rules || {});

  }
  async function saveRules(){

  // Einmaliger Import der Daten, die vor der Firebase-Umstellung bereits im

  var seedAttempted = false;

  async function maybeSeed(){

    try{
      var claimed = await window.FB.claimSeed();

    });

  function initials(p){

  function nextColor(){ return PALETTE[state.players.length % PALETTE.length]; }

  function fmtDate(iso){
    var d = new Date(iso);
    if(isNaN(d)) return "–";
    return d.toLocaleDateString("de-DE", { weekday:"short", day:"2-digit", month:"2-digit", year:"numeric" });
  }
  function fmtTime(iso){
    var d = new Date(iso);
    if(isNaN(d)) return "";
    return d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
  }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function nowDateVal(){ var d = new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function nowTimeVal(){ var d = new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }

  function sortedMatchdays(){
    return state.matchdays.slice().sort(function(a,b){ return new Date(b.dateTime) - new Date(a.dateTime); });
  }

  function matchdayWinnerIds(md){
    if(!md.entries.length) return [];
    var best = state.rules.scoring === "higher"
      ? Math.max.apply(null, md.entries.map(function(e){ return e.points; }))
      : Math.min.apply(null, md.entries.map(function(e){ return e.points; }));
    return md.entries.filter(function(e){ return e.points === best; }).map(function(e){ return e.playerId; });
  }

  function standings(){
    var wins = {};
    state.matchdays.forEach(function(md){
      matchdayWinnerIds(md).forEach(function(pid){ wins[pid] = (wins[pid]||0) + 1; });
    });
    var rows = state.players.map(function(p){
      var total = 0, count = 0, mau = 0, best = null, worst = null;
      state.matchdays.forEach(function(md){
        var e = md.entries.find(function(x){ return x.playerId === p.id; });
        if(e){
          total += e.points;
          mau += e.mauViolations || 0;
          count++;
          if(best === null || e.points < best) best = e.points;
          if(worst === null || e.points > worst) worst = e.points;
        }
      });
      var penalty = mau * (Number(state.rules.mauPenalty) || 0);
      return {
        player: p,
        matchdays: count,
        rawPoints: total,
        mau: mau,
        penalty: penalty,
        total: total + penalty,
        avg: count ? (total + penalty) / count : 0,
        wins: wins[p.id] || 0,
        best: best, worst: worst
      };
    });
    var played = rows.filter(function(r){ return r.matchdays > 0; });
    var unplayed = rows.filter(function(r){ return r.matchdays === 0; });
    played.sort(function(a,b){
      var diff = state.rules.scoring === "higher" ? (b.total - a.total) : (a.total - b.total);
      if(diff !== 0) return diff;
      if(b.wins !== a.wins) return b.wins - a.wins;
      return fullName(a.player).localeCompare(fullName(b.player));
    });
    unplayed.sort(function(a,b){ return fullName(a.player).localeCompare(fullName(b.player)); });
    return played.concat(unplayed);
  }

      '<button class="btn btn-primary btn-sm" data-action="add-matchday" '+(!state.players.length?'disabled':'')+'>'+ICONS.plus+'Neu</button></div>';

    if(!state.players.length){

  /* ============================ RENDER: STATS ============================ */
  function renderStats(){
    var html = '<div class="section-head"><div><h2>Statistik</h2><div class="section-sub">Auswertung pro Spieler &amp; Spieltag</div></div></div>';

    if(!state.players.length){
      html += emptyState(ICONS.chart, "Noch keine Daten", "Legt Spieler an und erfasst Spieltage, um Statistiken zu sehen.", "");
      document.getElementById("view").innerHTML = html;
      return;
    }

    var rows = standings();
    if(!ui.statsPlayerId || !playerById(ui.statsPlayerId)){
      ui.statsPlayerId = state.players[0].id;
    }

    html += '<div class="card pad">';
    html += '<div class="field" style="margin-bottom:0"><label>Spieler auswählen</label><select id="statsPlayerSelect">';
    state.players.forEach(function(p){
      html += '<option value="'+p.id+'" '+(p.id===ui.statsPlayerId?'selected':'')+'>'+esc(fullName(p))+'</option>';
    });
    html += '</select></div></div>';

    var r = rows.find(function(x){ return x.player.id === ui.statsPlayerId; });
    if(r){
      html += '<div class="card pad">'+
        '<div class="stat-grid">'+
          statTile(r.total, "Gesamtpunkte") +
          statTile(r.matchdays, "Spieltage") +
          statTile(round1(r.avg), "Ø Punkte") +
          statTile(r.wins, "Siege") +
          statTile(r.mau, "Mau-Verstöße") +
          statTile(r.best===null?"–":r.best, "Beste Runde") +
        '</div>'+
      '</div>';

      var history = state.matchdays.filter(function(md){ return md.entries.some(function(e){ return e.playerId === r.player.id; }); })
        .sort(function(a,b){ return new Date(a.dateTime) - new Date(b.dateTime); });
      if(history.length){
        var vals = history.map(function(md){ return md.entries.find(function(e){ return e.playerId === r.player.id; }).points; });
        var maxAbs = Math.max(1, Math.max.apply(null, vals.map(Math.abs)));
        html += '<div class="card pad"><h3 style="font-size:.92rem;margin-bottom:10px">Punkteverlauf</h3>';
        history.forEach(function(md){
          var e = md.entries.find(function(x){ return x.playerId === r.player.id; });
          var pct = Math.max(4, Math.round(Math.abs(e.points)/maxAbs*100));
          html += '<div class="bar-row"><div class="who">'+fmtDate(md.dateTime).split(",")[0]+'</div>'+
            '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+r.player.color+'"></div></div>'+
            '<div class="bar-val">'+e.points+'</div></div>';
        });
        html += '</div>';
      }
    }

    if(rows.some(function(x){ return x.matchdays > 0; })){
      var maxTotal = Math.max(1, Math.max.apply(null, rows.map(function(x){ return Math.abs(x.total); })));
      html += '<div class="card pad"><h3 style="font-size:.92rem;margin-bottom:10px">Gesamtpunkte im Vergleich</h3>';
      rows.forEach(function(x){
        var pct = Math.max(4, Math.round(Math.abs(x.total)/maxTotal*100));
        html += '<div class="bar-row"><div class="who">'+esc(fullName(x.player))+'</div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+x.player.color+'"></div></div>'+
          '<div class="bar-val">'+x.total+'</div></div>';
      });
      html += '</div>';

      var maxMau = Math.max(1, Math.max.apply(null, rows.map(function(x){ return x.mau; })));
      if(rows.some(function(x){ return x.mau > 0; })){
        html += '<div class="card pad"><h3 style="font-size:.92rem;margin-bottom:10px">Mau-Verstöße im Vergleich</h3>';
        rows.forEach(function(x){
          var pct = Math.max(4, Math.round(x.mau/maxMau*100));
          html += '<div class="bar-row"><div class="who">'+esc(fullName(x.player))+'</div>'+
            '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--orange)"></div></div>'+
            '<div class="bar-val">'+x.mau+'</div></div>';
        });
        html += '</div>';
      }
    }

    document.getElementById("view").innerHTML = html;
    var sel = document.getElementById("statsPlayerSelect");
    if(sel) sel.addEventListener("change", function(){ ui.statsPlayerId = sel.value; renderStats(); });
  }
  function statTile(n,l){ return '<div class="stat-tile"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>'; }

  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
    };
  }

  function downscaleImage(file, maxSize, quality){
    return new Promise(function(resolve, reject){
      if(!/^image\//.test(file.type)){ reject(new Error("Keine Bilddatei")); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("Datei konnte nicht gelesen werden")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("Bild konnte nicht geladen werden")); };
        img.onload = function(){
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          var size = Math.min(maxSize, side);
          var canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

            '<input type="file" id="pPhotoInput" accept="image/*" />'+
            (photo.value ? '<button type="button" class="btn btn-destructive btn-sm" id="pPhotoRemove">Foto entfernen</button>' : '') +
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Vorname</label><input type="text" id="pFirst" required value="'+esc(editing?editing.firstName:"")+'" placeholder="Vorname" /></div>'+
        '<div class="field"><label>Nachname</label><input type="text" id="pLast" required value="'+esc(editing?editing.lastName:"")+'" placeholder="Nachname" /></div>'+
      '</div>'+
      '<div class="field"><label>Farbe</label><div class="swatches" id="swatches">'+
        PALETTE.map(function(c){ return '<div class="swatch'+(c===color?" selected":"")+'" data-color="'+c+'" style="background:'+c+'"></div>'; }).join("")+
      '</div><input type="hidden" id="pColor" value="'+color+'" /></div>'+
    '</form>';
    var foot = '<button class="btn btn-secondary btn-block" data-action="close-modal">Abbrechen</button>'+
      '<button class="btn btn-primary btn-block" id="playerSubmit">'+(editing?"Speichern":"Anlegen")+'</button>';
    openModal(editing ? "Spieler bearbeiten" : "Neuer Spieler", body, foot);

    function refreshPreview(){
      var previewPlayer = { firstName: document.getElementById("pFirst").value, lastName: document.getElementById("pLast").value, color: document.getElementById("pColor").value, photoURL: photo.value };
      document.getElementById("photoPreview").innerHTML = avatarHtml(previewPlayer, "");
    }

    document.querySelectorAll("#swatches .swatch").forEach(function(sw){
      sw.addEventListener("click", function(){
        document.querySelectorAll("#swatches .swatch").forEach(function(s){ s.classList.remove("selected"); });
        sw.classList.add("selected");
        document.getElementById("pColor").value = sw.getAttribute("data-color");
        refreshPreview();
      });
    });

    document.getElementById("pPhotoInput").addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      downscaleImage(file, 240, .72).then(function(dataUri){
        if(dataUri.length > 900000){ toast("Foto ist zu groß/komplex – bitte ein anderes wählen"); return; }
        photo.value = dataUri; photo.changed = true;
        refreshPreview();
      }).catch(function(){
        toast("Foto konnte nicht gelesen werden");
      });
    });
    var removeBtn = document.getElementById("pPhotoRemove");
    if(removeBtn) removeBtn.addEventListener("click", function(){
      photo.value = null; photo.changed = true;
      refreshPreview();
    });

    document.getElementById("playerSubmit").addEventListener("click", async function(){
      var first = document.getElementById("pFirst").value.trim();
      var last = document.getElementById("pLast").value.trim();
      if(!first || !last){ toast("Bitte Vor- und Nachname angeben"); return; }
      var col = document.getElementById("pColor").value;
      var payload = { firstName: first, lastName: last, color: col };
      if(photo.changed) payload.photoURL = photo.value; // null = entfernt, sonst neue Daten-URI
      try{
        if(editing){
          if(fbAvailable){ await window.FB.updatePlayer(editing.id, payload); }
          else { Object.assign(editing, payload); cacheLocal(); }
          toast("Spieler aktualisiert");
        } else {
          payload.createdAt = new Date().toISOString();
          if(fbAvailable){ await window.FB.addPlayer(payload); }
          else { state.players.push(Object.assign({ id: uid() }, payload)); cacheLocal(); }
          toast("Spieler angelegt");
        }
        closeModal();
        if(!fbAvailable) renderView();
      }catch(e){
        toast("Speichern fehlgeschlagen");
      }
    });
  }

  function openMatchdayModal(matchdayId){
    var editing = matchdayId ? state.matchdays.find(function(m){ return m.id === matchdayId; }) : null;
    var dateVal = editing ? editing.dateTime.slice(0,10) : nowDateVal();
    var timeVal = editing ? new Date(editing.dateTime).toTimeString().slice(0,5) : nowTimeVal();
    var entryMap = {};
    if(editing) editing.entries.forEach(function(e){ entryMap[e.playerId] = e; });

    var rowsHtml = state.players.map(function(p){
      var e = entryMap[p.id];
      var included = editing ? !!e : true;
      var pts = e ? e.points : 0;
      var mau = e ? (e.mauViolations||0) : 0;
      return '<div class="participant-row'+(included?"":" off")+'" data-player="'+p.id+'" style="--row-color:'+p.color+'">'+
        '<div class="who">'+
          '<button type="button" class="toggle-in'+(included?" on":"")+'" data-action="toggle-participant" data-id="'+p.id+'" title="Nimmt an diesem Spieltag teil" aria-label="Teilnahme von '+esc(fullName(p))+'">'+(included?ICONS.check:'')+'</button>'+
          avatarHtml(p, "sm") +
          '<div class="name">'+esc(fullName(p))+'</div>'+
          '<div class="not-in-badge" id="notin-'+p.id+'">'+(included?'':'nimmt nicht teil')+'</div>'+
        '</div>'+
        '<div class="participant-controls">'+
          '<div class="mini-field grow"><span class="mini-label">Punkte</span>'+
            '<input type="number" class="pts-input" data-pts="'+p.id+'" value="'+pts+'" step="1" '+(included?'':'tabindex="-1"')+' aria-label="Punkte für '+esc(fullName(p))+'" /></div>'+
          '<div class="mini-field"><span class="mini-label">Mau-Verstöße</span>'+
            '<div class="stepper" data-mau="'+p.id+'">'+
              '<button type="button" data-action="mau-dec" data-id="'+p.id+'" '+(included?'':'tabindex="-1"')+' aria-label="Mau-Verstöße verringern">'+ICONS.minus+'</button>'+
              '<span class="val" id="mauVal-'+p.id+'">'+mau+'</span>'+
              '<button type="button" data-action="mau-inc" data-id="'+p.id+'" '+(included?'':'tabindex="-1"')+' aria-label="Mau-Verstöße erhöhen">'+ICONS.plus+'</button>'+
            '</div></div>'+
        '</div>'+
      '</div>';
    }).join("");

    var body = '<form id="mdForm">'+
      '<div class="field-row">'+
        '<div class="field"><label>Datum</label><input type="date" id="mdDate" value="'+dateVal+'" required /></div>'+
        '<div class="field"><label>Uhrzeit</label><input type="time" id="mdTime" value="'+timeVal+'" required /></div>'+
      '</div>'+
      '<div class="field"><label>Notiz (optional)</label><input type="text" id="mdNote" value="'+esc(editing?editing.note||"":"")+'" placeholder="z. B. Ort oder Anlass" /></div>'+
      '<div class="field"><label>Teilnehmer &amp; Punkte</label>'+
        '<div class="hint" style="margin:-2px 0 10px">Häkchen anklicken, um einen Spieler ab-/anzumelden. Punkte und Mau-Verstöße gehören jeweils zur Zeile direkt darüber; abgemeldete Spieler (ausgegraut) zählen nicht mit.</div>'+
        '<div id="participants">'+rowsHtml+'</div>'+
      '</div>'+
    '</form>';
    var foot = '<button class="btn btn-secondary btn-block" data-action="close-modal">Abbrechen</button>'+
      '<button class="btn btn-primary btn-block" id="mdSubmit">'+(editing?"Speichern":"Erfassen")+'</button>';
    openModal(editing ? "Spieltag bearbeiten" : "Neuer Spieltag", body, foot);

    document.querySelectorAll('[data-action="toggle-participant"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var on = btn.classList.toggle("on");
        btn.innerHTML = on ? ICONS.check : "";
        var row = btn.closest(".participant-row");
        row.classList.toggle("off", !on);
        var badge = document.getElementById("notin-"+id);
        if(badge) badge.textContent = on ? "" : "nimmt nicht teil";
      });
    });
    document.querySelectorAll('[data-action="mau-inc"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var el = document.getElementById("mauVal-"+id);
        el.textContent = Math.max(0, Number(el.textContent)+1);
      });
    });
    document.querySelectorAll('[data-action="mau-dec"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var el = document.getElementById("mauVal-"+id);
        el.textContent = Math.max(0, Number(el.textContent)-1);
      });
    });

    document.getElementById("mdSubmit").addEventListener("click", async function(){
      var d = document.getElementById("mdDate").value;
      var t = document.getElementById("mdTime").value;
      if(!d || !t){ toast("Bitte Datum und Uhrzeit angeben"); return; }
      var iso = new Date(d+"T"+t+":00").toISOString();
      var note = document.getElementById("mdNote").value.trim();
      var entries = [];
      state.players.forEach(function(p){
        var row = document.querySelector('.participant-row[data-player="'+p.id+'"]');
        var on = row.querySelector('[data-action="toggle-participant"]').classList.contains("on");
        if(!on) return;
        var pts = Number(row.querySelector('[data-pts="'+p.id+'"]').value) || 0;
        var mau = Number(document.getElementById("mauVal-"+p.id).textContent) || 0;
        entries.push({ playerId: p.id, points: pts, mauViolations: mau });
      });
      if(!entries.length){ toast("Mindestens ein teilnehmender Spieler nötig"); return; }
      var payload = { dateTime: iso, note: note, entries: entries };
      try{
        if(editing){
          if(fbAvailable){ await window.FB.updateMatchday(editing.id, payload); }
          else { Object.assign(editing, payload); cacheLocal(); }
          toast("Spieltag aktualisiert");
        } else {
          if(fbAvailable){ await window.FB.addMatchday(payload); }
          else { state.matchdays.push(Object.assign({ id: uid() }, payload)); cacheLocal(); }
          toast("Spieltag erfasst");
        }
        closeModal();
        if(!fbAvailable) renderView();
      }catch(e){
        toast("Speichern fehlgeschlagen");
      }
    });
  }

  function confirmDelete(msg, onYes){
    var body = '<p>'+esc(msg)+'</p>';
    var foot = '<button class="btn btn-secondary btn-block" data-action="close-modal">Abbrechen</button>'+
      '<button class="btn btn-destructive btn-block" id="confirmYes">Löschen</button>';
    openModal("Wirklich löschen?", body, foot);
    document.getElementById("confirmYes").addEventListener("click", function(){
      onYes(); closeModal();
    });
  }

  /* ============================ EVENT DELEGATION ============================ */
  document.addEventListener("click", async function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");
    var id = t.getAttribute("data-id");

    switch(action){
      case "set-tab": setTab(t.getAttribute("data-tab")); break;
      case "add-player": openPlayerModal(null); break;
      case "edit-player": openPlayerModal(id); break;
      case "delete-player":
        var p = playerById(id);
        if(!p) return;
        confirmDelete('„'+fullName(p)+'“ und alle zugehörigen Punktestände in bestehenden Spieltagen werden entfernt.', async function(){
          var affected = state.matchdays.filter(function(md){ return md.entries.some(function(en){ return en.playerId === id; }); });
          try{
            if(fbAvailable){
              await Promise.all(affected.map(function(md){
                return window.FB.updateMatchday(md.id, { entries: md.entries.filter(function(en){ return en.playerId !== id; }) });
              }));
              await window.FB.deletePlayer(id);
            } else {
              state.players = state.players.filter(function(x){ return x.id !== id; });
              state.matchdays.forEach(function(md){ md.entries = md.entries.filter(function(en){ return en.playerId !== id; }); });
              cacheLocal(); renderView();
            }
            toast("Spieler gelöscht");
          }catch(err){ toast("Löschen fehlgeschlagen"); }
        });
        break;
      case "add-matchday": openMatchdayModal(null); break;
      case "edit-matchday": openMatchdayModal(id); break;
      case "delete-matchday":
        confirmDelete("Dieser Spieltag wird endgültig gelöscht.", async function(){
          try{
            if(fbAvailable){ await window.FB.deleteMatchday(id); }
            else { state.matchdays = state.matchdays.filter(function(x){ return x.id !== id; }); cacheLocal(); renderView(); }
            toast("Spieltag gelöscht");
          }catch(err){ toast("Löschen fehlgeschlagen"); }
        });
        break;
      case "toggle-matchday":
        if(ui.expandedMatchdays.has(id)) ui.expandedMatchdays.delete(id);
        else ui.expandedMatchdays.add(id);
        renderMatchdays();
        break;
      case "add-rule":
        state.rules.items.push("");
        await saveRules();
        renderRules();
        setTimeout(function(){
          var tas = document.querySelectorAll(".rule-text");
          if(tas.length) tas[tas.length-1].focus();
        }, 0);
        break;
      case "remove-rule":
        state.rules.items.splice(Number(t.getAttribute("data-index")), 1);
        await saveRules();
        toast("Regel entfernt"); renderRules();
        break;
      case "close-modal": closeModal(); break;
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && modalRoot.innerHTML) closeModal();
  });

  /* ============================ INIT ============================ */
  renderTabbar();
  renderView();
  startFirebase();
})();
</script>
</body>
</html>
